; Grafana: private, reachable only through an SSM port-forward

[server]
; Loopback only: not exposed on the network
http_addr = 127.0.0.1
http_port = 3000

[security]
admin_user = admin
; Read from a file written at boot from SSM, never stored in config
admin_password = $__file{/etc/grafana/admin_password}
disable_gravatar = true

; No self sign-up and no anonymous access
[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

; No phoning home from a private server
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
