[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
admin_user = admin
admin_password = $__file{/etc/grafana/admin_password}
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false